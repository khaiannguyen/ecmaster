name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài công cụ build
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git
      - name: Build SOEM 2.0
        run: |
          git clone https://github.com/OpenEtherCATsociety/SOEM /tmp/SOEM
          cd /tmp/SOEM
          git checkout v2.0.0
          mkdir build && cd build
          cmake ..
          make
