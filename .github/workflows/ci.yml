# ecmaster CI (Giai doan 7.5)
#
#  offline   unit tests that need neither SOEM nor a network, incl. ASan/UBSan,
#            and ThreadSanitizer on every lock-free queue (tests/tsan)
#  golden    fixed ecm_run scenario against soft_bus over veth, captured with
#            tshark; its datagram structure must match tools/golden/golden_ecm_run.txt,
#            and a negative control (two datagrams swapped) must NOT match;
#            the same scenario in ENI mode (GD8 8.4, E-05) must match
#            tools/golden/golden_ecm_run_eni.txt, and an ENI without the
#            Startup SDO must NOT match it
#            GD9.1: the one-slave bus (every slave GROUP_MOTION, GROUP_IO
#            empty) has its own golden, tools/golden/golden_ecm_run_n1.txt
#            GD9.3: soft_bus --coe-ca (SOEM maps with Complete Access) has
#            tools/golden/golden_ecm_run_ca.txt; the default golden is unchanged
#  l5-smoke  a subset of the L5 fault-injection cases. GitHub runners are
#            shared and not RT, so this job reports but does not block
#            (continue-on-error); the reference results come from the Jetson.
#  etf-soft  GD8 8.5: `ecm_run --link etf` on a multi-queue veth pair with
#            mqprio + ETF in SOFTWARE mode (tools/etf/run_etf_veth.sh): smoke
#            (motion frames through ETF, all others bypass it, no ETF drop) and
#            the L5 subset with --link etf. Functional only -- veth has no
#            launch-time offload; launch accuracy is measured on the i226
#            (R-02, docs i226.md). Non-blocking like l5-smoke.
#
# SOEM: v2.0.0, EC_MAXGROUP=4 (ecm_run uses group 2), plus
# patches/soem-mbx-cnt.patch (L5-12, see docs/fault_policy.md §11) and
# patches/soem-txtime.patch (GD8 8.5, SO_TXTIME; off unless --link etf, so the
# golden capture must not change).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SOEM_DIR: /tmp/SOEM
  SOEM_TAG: v2.0.0

jobs:
  offline:
    name: Offline unit tests (x86, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libxml2-utils curl
      - name: ESI against the ESI XML schema (GD8 8.2, schema 1.17 + negative control)
        run: tools/esi/check_xsd.sh
      - name: CA ESI variant (GD9.3) up to date, valid, matches the --coe-ca SII (+ negative)
        run: tools/esi/check_ca_variant.sh
      - name: P1 draft ESI valid (GD9.4); ENI audit of the soft_bus ENIs (no UNKNOWN, LRD = mailbox poll)
        run: |
          tools/esi/check_xsd.sh config/esi/p1_draft_esi.xml
          for f in config/eni/eni_1node_1pdo.xml config/eni/eni_8node.xml config/eni/eni_8node_dc.xml config/eni/eni_8node_dc_sdo.xml; do
            python3 tools/eni/eni_audit.py --known config/eni/known_regs.txt "$f" > /tmp/audit.md
            grep -q 'not in the known list: 0' /tmp/audit.md
            grep -q '(process data by LRW)' /tmp/audit.md
          done
      - name: Committed .enicfg files up to date with eni2cfg.py (GD9.6, + negative control)
        run: tools/eni/check_enicfg.sh
      - name: soft_bus (SII, ESM, DC, fault injection, CoE C-01, GD9.9 profiles)
        run: make -C tools/soft_bus test
      - name: soft_bus profile of the P1 draft ESI up to date (GD9.9 esi2profile)
        run: |
          python3 tools/esi/esi2profile.py config/esi/p1_draft_esi.xml -o /tmp/p1_draft.prof
          cmp /tmp/p1_draft.prof config/profiles/p1_draft.prof
      - name: libecmaster/telemetry (histogram, SPSC ring, turnaround pairing)
        run: make -C libecmaster/telemetry run
      - name: libecmaster/core (ecm_dc reply-age gate)
        run: make -C libecmaster/core test test_asan
      - name: libecmaster/diag
        run: make -C libecmaster/diag test test_asan
      - name: libecmaster/policy (bus state machine, recovery planner, freshness, GD9.7 AL code classes)
        run: make -C libecmaster/policy test test_asan
      - name: libecmaster/config (ENI loader, identity/layout checks, GD8 8.4; GD9.6 register InitCmd table, LRD/LWR, state timeouts)
        run: make -C libecmaster/config test
      - name: libecmaster/pdo (PDO entry table, bind, bit-level get/set, GD9.10)
        run: make -C libecmaster/pdo test test_asan
      - name: ThreadSanitizer on the lock-free queues (7.6, self-check + negative control)
        run: tests/tsan/run_tsan.sh 1000000


  golden:
    name: Golden pcap (soft_bus over veth)
    needs: offline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git tshark python3
      - name: Build SOEM ${{ env.SOEM_TAG }} (EC_MAXGROUP=4, mailbox Cnt + txtime patches)
        run: |
          git clone --depth 1 --branch "$SOEM_TAG" https://github.com/OpenEtherCATsociety/SOEM "$SOEM_DIR"
          patch -d "$SOEM_DIR" -p1 < patches/soem-mbx-cnt.patch
          patch -d "$SOEM_DIR" -p1 < patches/soem-txtime.patch
          cmake -S "$SOEM_DIR" -B "$SOEM_DIR/build" -DEC_MAXGROUP=4
          cmake --build "$SOEM_DIR/build" -j
      - name: Build soft_bus and ecm_run
        run: |
          make -C tools/soft_bus
          make -C apps/ecm_run SOEM_DIR="$SOEM_DIR"
      - name: veth pair
        run: |
          sudo ip link add veth_m type veth peer name veth_s
          sudo ip link set veth_m up
          sudo ip link set veth_s up
      - name: Golden structure check
        run: sudo -E tools/golden/check_golden.sh
      - name: Negative control (SM watchdog writes swapped must be detected)
        run: sudo -E tools/golden/negative_control.sh
      - name: Golden structure check, ENI mode (E-05)
        run: sudo -E env ENI=config/eni/eni_8node_dc_sdo.enicfg tools/golden/check_golden.sh
      - name: Negative control, ENI mode (ENI without the Startup SDO must be detected)
        run: >
          sudo -E env ENI=config/eni/eni_8node_dc.enicfg
          GOLDEN=tools/golden/golden_ecm_run_eni.txt EXPECT_DIFF=1
          tools/golden/check_golden.sh
      - name: Golden structure check, one-slave bus (GD9.1 G-08)
        run: >
          sudo -E env N=1 GROUP_ARGS= GOLDEN=tools/golden/golden_ecm_run_n1.txt
          tools/golden/check_golden.sh
      - name: --io-slaves 5-8 is the old --motion-slaves 4 (GD9.1 G-01b)
        run: sudo -E env GROUP_ARGS="--io-slaves 5-8" tools/golden/check_golden.sh
      - name: Golden structure check, soft_bus --coe-ca (GD9.3 C-05) + negative control
        run: |
          sudo -E env SB_ARGS=--coe-ca GOLDEN=tools/golden/golden_ecm_run_ca.txt tools/golden/check_golden.sh
          sudo -E env GOLDEN=tools/golden/golden_ecm_run_ca.txt EXPECT_DIFF=1 tools/golden/check_golden.sh
      - name: ENI loader for vendor ENIs (GD9.6 E-06 LRD/LWR, E-07 TwinCAT IS620N, E-08 unknown register InitCmd, E-09 slow SDO)
        run: sudo -E env CASES="e06 e07 e08 e09" LOG=/tmp/log_gd9_eni tools/gd9/run_eni_9_6.sh
      - name: DC per slave from the ENI (GD9.5 DC-01..DC-04b; L6 is run on the Jetson, not here)
        run: sudo -E env CASES="dc01 dc02 dc02n dc03 dc03n dc04 dc04b" LOG=/tmp/log_gd9_dc tools/gd9/run_dc_9_5.sh
      - name: EMCY + AL status code classes (GD9.7 M-01..M-03, P-01a/b, P-03)
        run: sudo -E env CASES="m01 m02 m03 p01a p01b p03" LOG=/tmp/log_gd9_emcy tools/gd9/run_emcy_9_7.sh
      - name: Input freshness per slave (GD9.8 F-02a..d)
        run: sudo -E env CASES="f02a f02b f02c f02d" LOG=/tmp/log_gd9_fresh tools/gd9/run_fresh_9_8.sh
      - name: Bind PDO by (slave, index, sub) (GD9.10 B-01..B-03)
        run: sudo -E env CASES="b01 b01c b01n b02 b02b b03" LOG=/tmp/log_gd9_pdo tools/gd9/run_pdo_9_10.sh
      - name: Mixed virtual bus P1 + IS620N from ESI profiles (GD9.9 V-01..V-03, DC-02, B-02m, GD10.1 B-05, N-01..N-03c)
        run: sudo -E env CASES="v01 v02 v03 b02m b05 n01 n02 n03" LOG=/tmp/log_gd9_mixed tools/gd9/run_mixed_9_9.sh
      - name: Keep the capture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-capture
          path: |
            /tmp/golden_now.pcap
            /tmp/log_gd9_eni
            /tmp/log_gd9_dc
            /tmp/log_gd9_emcy
            /tmp/log_gd9_fresh
            /tmp/log_gd9_pdo
            /tmp/golden_now_*.txt*
            /tmp/ecm_run_golden.log

  l5-smoke:
    name: L5 fault injection smoke (non-RT runner, non-blocking)
    needs: offline
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git tshark python3
      - name: Build SOEM ${{ env.SOEM_TAG }} (EC_MAXGROUP=4, mailbox Cnt + txtime patches)
        run: |
          git clone --depth 1 --branch "$SOEM_TAG" https://github.com/OpenEtherCATsociety/SOEM "$SOEM_DIR"
          patch -d "$SOEM_DIR" -p1 < patches/soem-mbx-cnt.patch
          patch -d "$SOEM_DIR" -p1 < patches/soem-txtime.patch
          cmake -S "$SOEM_DIR" -B "$SOEM_DIR/build" -DEC_MAXGROUP=4
          cmake --build "$SOEM_DIR/build" -j
      - name: Build
        run: |
          make -C tools/soft_bus
          for d in apps/ecm_run apps/ecm_diag apps/l4_test; do make -C "$d" SOEM_DIR="$SOEM_DIR"; done
      - name: veth pair
        run: |
          sudo ip link add veth_m type veth peer name veth_s
          sudo ip link set veth_m up
          sudo ip link set veth_s up
      - name: 7.2 diagnostics (L5-06, L5-11)
        working-directory: apps/ecm_diag
        run: sudo -E SB_ARGS=--no-sm-wd ./run_l5_diag.sh --no-tx-ts
      - name: 7.3 fault policy (L5-01, L5-02, L5-05 + negative controls)
        working-directory: apps/ecm_run
        run: sudo -E SB_ARGS=--no-sm-wd ECM_ARGS=--no-tx-ts OVR_MAX=50 CASES="l501 l502 l502neg l505 l505neg" ./run_l5_policy.sh
      - name: 7.4 late/stale/mailbox (L5-09, L5-12 + negative control)
        working-directory: apps/ecm_run
        run: sudo -E SB_ARGS=--no-sm-wd CASES="l509 l509neg l512" ./run_l5_io.sh
      - name: GD9.1 group assignment, one-slave and motion-only buses (G-03..G-07)
        run: sudo -E SB_ARGS=--no-sm-wd ECM_ARGS=--no-tx-ts NOFRAME_PCT=5 tools/gd9/run_groups.sh
      - name: GD9.3 Complete Access, normal/segmented download (C-02..C-05, L4-07/08)
        run: sudo -E tools/gd9/run_coe.sh
      - name: GD9.1 L5 on a one-slave bus (policy + io subset)
        working-directory: apps/ecm_run
        run: |
          sudo -E N=1 M=0 L505_SLAVE=1 SB_ARGS=--no-sm-wd ECM_ARGS=--no-tx-ts OVR_MAX=50 CASES="l502 l505 l505neg" ./run_l5_policy.sh
          sudo -E N=1 M=0 L509_SLAVE=1 SB_ARGS=--no-sm-wd CASES="l509 l509neg l512" ./run_l5_io.sh

  etf-soft:
    name: ETF software mode, --link etf (veth + mqprio, non-blocking)
    needs: offline
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git
      - name: Qdisc modules (mqprio, etf)
        run: |
          sudo modprobe sch_mqprio && sudo modprobe sch_etf || {
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_mqprio && sudo modprobe sch_etf; }
      - name: Build SOEM ${{ env.SOEM_TAG }} (EC_MAXGROUP=4, mailbox Cnt + txtime patches)
        run: |
          git clone --depth 1 --branch "$SOEM_TAG" https://github.com/OpenEtherCATsociety/SOEM "$SOEM_DIR"
          patch -d "$SOEM_DIR" -p1 < patches/soem-mbx-cnt.patch
          patch -d "$SOEM_DIR" -p1 < patches/soem-txtime.patch
          cmake -S "$SOEM_DIR" -B "$SOEM_DIR/build" -DEC_MAXGROUP=4
          cmake --build "$SOEM_DIR/build" -j
      - name: Build
        run: |
          make -C tools/soft_bus
          for d in apps/ecm_run apps/l4_test; do make -C "$d" SOEM_DIR="$SOEM_DIR"; done
      - name: --link etf smoke + L5 subset (own veth pair vethe_m/vethe_s)
        run: sudo -E tools/etf/run_etf_veth.sh all
