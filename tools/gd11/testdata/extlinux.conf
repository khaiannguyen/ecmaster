TIMEOUT 30
DEFAULT real-time

MENU TITLE L4T boot options

LABEL primary
      MENU LABEL primary kernel
      LINUX /boot/Image
      FDT /boot/dtb/kernel_tegra234-p3768-0000+p3767-0005-nv.dtb
      INITRD /boot/initrd
      APPEND ${cbootargs} root=PARTUUID=0000 rw rootwait rootfstype=ext4 console=ttyTCU0,115200

LABEL real-time
      MENU LABEL real-time kernel
      LINUX /boot/Image.rt
      FDT /boot/dtb/kernel_tegra234-p3768-0000+p3767-0005-nv.dtb
      INITRD /boot/initrd.rt
      APPEND ${cbootargs} root=PARTUUID=0000 rw rootwait rootfstype=ext4 console=ttyTCU0,115200 isolcpus=3 irqaffinity=0-2 transparent_hugepage=never
