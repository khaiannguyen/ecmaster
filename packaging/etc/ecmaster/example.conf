#
# ecmaster: one ecm_run instance = one file /etc/ecmaster/NAME.conf,
# started with `systemctl start ecm_run@NAME` (Phase 12.2).
# Read by ecmaster-run, never sourced: KEY=VALUE, no shell syntax.
#
# This example takes two Inovance IS620N to OP and publishes stats.json; it
# does NOT enable any axis (no --hook). Copy it, then edit the copy:
#   sudo cp /etc/ecmaster/example.conf /etc/ecmaster/demo.conf

# EtherCAT port (never the port with the default route)
ECM_IFACE=enP1p1s0

# Every other ecm_run option (ecm_run --help). Motion needs --axis / --hook
# cia402 and the safety rules of docs/safety_boundary.md.
ECM_ARGS="--n 2 --eni @PREFIX@/config/eni/eni_2servo.enicfg --pdo-scan --emcy-map @PREFIX@/config/emcy/is620n.emcy"

# stats.json / ctl.sock in /run/ecmaster/NAME (docs/api.md)
ECM_API=yes

# Refuse to start when ECM_IFACE is not set up by ecmaster-net@ECM_IFACE
# (rx-usecs 0, GRO off). `no` only for veth test rigs.
ECM_NET_CHECK=yes

# ecm_run binary (default: the installed one)
#ECM_BIN=/opt/ecmaster/bin/ecm_run
